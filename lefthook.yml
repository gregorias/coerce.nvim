check:
  parallel: true
  commands:
    tests:
      tags: test
      run: just test
    typecheck:
      tags: typecheck
      glob: "*.lua"
      run: just typecheck
    check-lua:
      tags: style
      glob: "*.lua"
      run: just check-lua
    lint-lua:
      tags: style lint
      glob: "*.lua"
      run: just lint-lua
    lint-markdown:
      tags: documentation style
      glob: "*.md"
      run: just lint-markdown
    check-links:
      tags: documentation
      glob: "*.md"
      run: just check-links
    check-yaml:
      tags: style
      glob: "*.{yml,yaml}"
      run: just check-yaml

format:
  parallel: true
  commands:
    format-lua:
      tags: style
      glob: "*.lua"
      run: just format-lua
    format-yaml:
      tags: style
      glob: "*.{yml,yaml}"
      run: just format-yaml
